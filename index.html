<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090B10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Todo Delivery - Cadetes</title>
  
  <!-- Fuente Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#090B10',
              surface: '#121620',
              surfaceLight: '#1A202E',
              accent: '#00E58F',
              accentHover: '#00C77B',
              accentGlow: 'rgba(0, 229, 143, 0.25)',
              textMuted: '#8E9AA8',
              border: '#1F2636'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Estilos base y ajustes de scroll PWA */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      user-select: none;
    }
    input {
      user-select: auto;
    }
    body {
      background-color: #090B10;
      color: #FFFFFF;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    /* Animaciones de Splash y Transición */
    .pulse-glow {
      box-shadow: 0 0 50px 10px rgba(0, 229, 143, 0.18);
    }
    @view-transition {
      navigation: auto;
    }
    @keyframes barProgress {
      0% { width: 0%; }
      40% { width: 45%; }
      75% { width: 85%; }
      100% { width: 100%; }
    }
    
    .animate-progress {
      animation: barProgress 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    /* Transición suave entre pantallas */
    .fade-out {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    
    .fade-in {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hidden-state {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
    }
  </style>
</head>
<body class="flex items-center justify-center p-0 m-0 font-sans antialiased">

  <!-- ============================================== -->
  <!-- 1. PANTALLA DE CARGA / SPLASH SCREEN           -->
  <!-- ============================================== -->
  <div id="splashScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-between p-8 bg-brand-bg select-none transition-all duration-500">
    <!-- Luz ambiental de fondo -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-brand-accent/15 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Espaciador superior -->
    <div class="w-full h-8"></div>

    <!-- Centro: Logo e Identidad -->
    <div class="flex flex-col items-center text-center relative z-10">
      <!-- Isotipo / Icono con Halo -->
      <div class="relative flex items-center justify-center w-24 h-24 mb-6 rounded-3xl bg-brand-surface border border-brand-border pulse-glow">
        <svg class="w-12 h-12 text-brand-accent transform -rotate-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-brand-accent"></span>
        </span>
      </div>

      <h1 class="text-3xl font-extrabold tracking-tight text-white">
        Todo <span class="text-brand-accent">Delivery</span>
      </h1>
      <p class="mt-2 text-xs font-semibold uppercase tracking-[0.25em] text-brand-textMuted">
        Cadetes &bull; Rider App
      </p>
    </div>

    <!-- Parte Inferior: Barra de Carga & Versión -->
    <div class="w-full max-w-xs flex flex-col items-center gap-4 relative z-10 pb-4">
      <div class="w-full h-1.5 bg-brand-surfaceLight rounded-full overflow-hidden border border-brand-border/50">
        <div class="h-full bg-brand-accent rounded-full animate-progress"></div>
      </div>
      <div class="flex items-center justify-between w-full text-[11px] font-medium text-brand-textMuted tracking-wide">
        <span id="loadingStatus">Iniciando terminal seguro...</span>
        <span class="text-white/40">v2.4</span>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. PANTALLA DE INICIO DE SESIÓN (LOGIN)         -->
  <!-- ============================================== -->
  <main id="loginScreen" class="w-full max-w-md min-h-[100dvh] flex flex-col justify-between p-6 sm:p-8 bg-brand-bg hidden-state">
    
    <!-- Header del Login -->
    <header class="pt-6 sm:pt-10">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-brand-surface border border-brand-border flex items-center justify-center text-brand-accent">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <span class="font-bold text-sm tracking-tight text-white">Todo <span class="text-brand-accent">Delivery</span></span>
        </div>

        <span class="inline-flex items-center gap-1.5 px-3 py-1 text-[11px] font-semibold tracking-wide text-brand-accent bg-brand-accent/10 border border-brand-accent/20 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-brand-accent"></span>
          Acceso Cadete
        </span>
      </div>

      <div class="mt-8">
        <h2 class="text-2xl font-bold text-white tracking-tight">Bienvenido al turno</h2>
        <p class="text-sm text-brand-textMuted mt-1.5 leading-relaxed">
          Ingresa con las credenciales asignadas por la administración para comenzar a recibir pedidos.
        </p>
      </div>
    </header>

    <!-- Formulario de Acceso -->
    <form id="cadetLoginForm" class="my-auto py-6 space-y-4" onsubmit="handleLogin(event)">
      <!-- Campo: DNI / Identificador -->
      <div>
        <label for="cadetId" class="block text-xs font-semibold uppercase tracking-wider text-brand-textMuted mb-2">
          Número de DNI / ID Cadete
        </label>
        <div class="relative">
          <input
            id="cadetId"
            type="tel"
            inputmode="numeric"
            pattern="[0-9]*"
            required
            placeholder="Ej: 38459120"
            class="w-full px-4 py-3.5 bg-brand-surface border border-brand-border rounded-xl text-white placeholder-brand-textMuted/50 text-sm font-medium focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all duration-200"
          />
          <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-brand-textMuted">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Campo: Contraseña o PIN -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="cadetPin" class="text-xs font-semibold uppercase tracking-wider text-brand-textMuted">
            PIN o Clave de Acceso
          </label>
        </div>
        <div class="relative">
          <input
            id="cadetPin"
            type="password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3.5 bg-brand-surface border border-brand-border rounded-xl text-white placeholder-brand-textMuted/50 text-sm font-medium tracking-widest focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all duration-200"
          />
          <button
            type="button"
            onclick="togglePinVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-brand-textMuted hover:text-white transition-colors"
          >
            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Botón de Acción Principal -->
      <div class="pt-3">
        <button
          type="submit"
          id="btnLogin"
          class="w-full py-4 px-6 rounded-xl bg-brand-accent text-brand-bg font-bold text-sm tracking-wide uppercase hover:bg-brand-accentHover active:scale-[0.98] transition-all duration-150 shadow-lg shadow-brand-accent/20 flex items-center justify-center gap-2"
        >
          <span>Iniciar Turno / Conectar</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </div>
    </form>

    <!-- Footer / Soporte Operativo -->
    <footer class="pt-4 pb-6 text-center border-t border-brand-border/60">
      <p class="text-xs text-brand-textMuted">
        ¿Problemas con tu cuenta o clave revocada?
      </p>
      <button onclick="alert('Comunícate con la central de administración para reactivar tus credenciales.')" class="mt-1 text-xs font-semibold text-brand-accent hover:underline">
        Contactar a Administración de Todo Delivery
      </button>
    </footer>
  </main>

  <!-- LÓGICA DE CONTROL Y AUTENTICACIÓN SUPABASE -->
  <script type="module">
    import { supabase } from './Scripts/conexion_supabase.js';

    // Función para calcular Hash SHA-256 en formato Hexadecimal
    async function hashSHA256(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Simulación de carga y redirección fluida al Login
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splashScreen');
      const login = document.getElementById('loginScreen');
      const statusText = document.getElementById('loadingStatus');

      // Cambio sutil de texto durante la carga
      setTimeout(() => {
        statusText.innerText = 'Verificando servicios...';
      }, 1100);

      // Desvanecer Splash y mostrar Login
      setTimeout(() => {
        splash.classList.add('fade-out');
        
        setTimeout(() => {
          splash.style.display = 'none';
          login.classList.remove('hidden-state');
          login.classList.add('fade-in');
        }, 450);
      }, 2300);
    });

    // Alternar visibilidad de PIN / Clave
    window.togglePinVisibility = function() {
      const pinInput = document.getElementById('cadetPin');
      const isPassword = pinInput.type === 'password';
      pinInput.type = isPassword ? 'text' : 'password';
    };

    // Manejo de Login con Verificación en Supabase
    window.handleLogin = async function(e) {
      e.preventDefault();
      const cadetIdInput = document.getElementById('cadetId');
      const cadetPinInput = document.getElementById('cadetPin');
      const btn = document.getElementById('btnLogin');

      const idCad = cadetIdInput.value.trim();
      const rawPin = cadetPinInput.value;

      if (!idCad || !rawPin) {
        alert('Por favor, completa todos los campos.');
        return;
      }

      // Estado de carga en el botón
      btn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-brand-bg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>Validando credenciales...</span>
      `;
      btn.disabled = true;

      const resetBtn = () => {
        btn.innerHTML = `
          <span>Iniciar Turno / Conectar</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        `;
        btn.disabled = false;
      };

      try {
        // 1. Hashear contraseña ingresada con SHA-256
        const hashedInputPin = await hashSHA256(rawPin);

        // 2. Consultar en Supabase la tabla 'Cadetes' con todos los campos (*) filtrando por 'id_cad'
        const { data: cadet, error } = await supabase
          .from('Cadetes')
          .select('*')
          .eq('id_cad', idCad)
          .maybeSingle();

        if (error) {
          console.error('Error al consultar Supabase:', error);
          alert(`Error al conectar con el servidor: ${error.message || 'Intente nuevamente'}`);
          resetBtn();
          return;
        }

        // 3. Verificar si el usuario existe
        if (!cadet) {
          alert('El ID o DNI de cadete no está registrado en el sistema.');
          resetBtn();
          return;
        }

        // 4. Comparar el hash de la contraseña (ignorando mayúsculas/minúsculas)
        const storedHash = (cadet.contra_cad || '').toLowerCase().trim();
        if (storedHash !== hashedInputPin.toLowerCase()) {
          alert('La clave o PIN ingresado es incorrecto.');
          resetBtn();
          return;
        }

        // 5. Autenticación exitosa: guardar datos del cadete en localStorage y redirigir
        localStorage.setItem('cadet_session', JSON.stringify(cadet));
        sessionStorage.setItem('cadet_tab_id', String(cadet.id_cad)); // Aísla la pestaña para permitir testear múltiples cadetes

        btn.innerHTML = `
          <svg class="w-5 h-5 text-brand-bg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>¡Acceso Concedido!</span>
        `;

        setTimeout(() => {
          window.location.href = 'Templates/dashboard.html';
        }, 600);

      } catch (err) {
        console.error('Error inesperado durante el login:', err);
        alert('Ocurrió un error inesperado al procesar el inicio de sesión.');
        resetBtn();
      }
    };
  </script>
</body>
</html>
